name: Semantic Version Tag and Release

on:
  push:
    branches:
      - main

jobs:
  tag_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Auto Tag based on commit message
        id: autotag
        uses: butlerlogic/action-autotag@stable
        with:
          tag_prefix: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.autotag.outputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.autotag.outputs.tag }}
          name: "Release ${{ steps.autotag.outputs.tag }}"
          body: "Release created from commit message trigger"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
